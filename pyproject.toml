[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylocalsend"
version = "0.1.0"
description = "Secure LAN file transfer with CLI and WebUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "nicegui>=1.4",
    "cryptography>=42",
    "httpx>=0.27",
    "rich>=13",
    "aiofiles>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pylocalsend = "pylocalsend.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pylocalsend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
