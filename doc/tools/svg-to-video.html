<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG 动画 → MP4 → GIF</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px;
      background: #f5f4f0;
      color: #222;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 8px; }
    p.hint { margin: 0 0 20px; color: #666; font-size: 0.9rem; line-height: 1.5; }
    .panel {
      background: #fff;
      border: 1px solid #e0ddd6;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    label { font-size: 0.85rem; color: #444; display: flex; flex-direction: column; gap: 4px; }
    input[type="number"], input[type="text"], select {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      min-width: 100px;
    }
    button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #eee; }
    button.primary {
      background: #2f8f83;
      color: #fff;
      border-color: #267a70;
    }
    button.primary:hover { background: #267a70; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #preview-wrap {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    #preview-wrap > div { flex: 1; min-width: 280px; }
    .caption { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
    canvas, #svg-host svg {
      display: block;
      max-width: 100%;
      height: auto;
      border: 1px solid #e0ddd6;
      background: #fbfaf7;
    }
    #svg-host { position: absolute; left: -9999px; top: 0; visibility: hidden; pointer-events: none; }
    #log {
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      color: #555;
      min-height: 2em;
    }
    .preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>SVG 动画 → MP4 → GIF</h1>
  <p class="hint">
    使用 Chromium 渲染 SMIL 动画 SVG，把每个时间点烘焙为静态帧后绘制到 Canvas，再用 WebCodecs 编码为 MP4。
    下载 MP4 后，使用同目录下的 <code>mp4-to-gif.py</code> 调用 ffmpeg 转成 GIF。
  </p>

  <div class="panel">
    <div class="row">
      <span style="font-size:0.85rem;color:#444;">预设 SVG：</span>
      <div class="preset-btns">
        <button type="button" data-preset="traditional">传统方案.svg</button>
        <button type="button" data-preset="stream">pylocalsend-stream.svg</button>
      </div>
    </div>
    <div class="row">
      <label>
        或选择本地 SVG
        <input type="file" id="file-input" accept=".svg,image/svg+xml">
      </label>
      <label>
        输出文件名
        <input type="text" id="out-name" value="animation.mp4">
      </label>
      <label>
        基准宽度
        <input type="number" id="width" value="960" min="320" max="3840">
      </label>
      <label>
        基准高度
        <input type="number" id="height" value="420" min="240" max="2160">
      </label>
      <label>
        渲染倍率
        <input type="number" id="render-scale" value="2" min="1" max="4" step="0.25">
      </label>
      <label>
        帧率
        <input type="number" id="fps" value="30" min="10" max="60">
      </label>
      <label>
        时长（秒）
        <input type="number" id="duration" value="10" min="1" max="120" step="0.1">
      </label>
      <label>
        动画循环周期（秒，0=不循环）
        <input type="number" id="cycle" value="10" min="0" max="120" step="0.1">
      </label>
    </div>
    <div class="row">
      <button type="button" class="primary" id="record-btn">生成并下载 MP4</button>
      <button type="button" id="preview-btn">预览一帧</button>
    </div>
  </div>

  <div class="panel">
    <div id="preview-wrap">
      <div>
        <div class="caption">Canvas 预览</div>
        <canvas id="canvas" width="960" height="420"></canvas>
      </div>
    </div>
    <div id="svg-host"></div>
  </div>

  <div class="panel">
    <div class="caption">状态</div>
    <div id="log">就绪。选择 SVG 后点击「生成并下载 MP4」。</div>
  </div>

  <script type="module">
    const PRESETS = {
      traditional: {
        name: "传统方案",
        file: "传统方案.mp4",
        duration: 10,
        cycle: 10,
        url: "../传统方案.svg",
      },
      stream: {
        name: "pylocalsend-stream",
        file: "pylocalsend-stream.mp4",
        duration: 5.6,
        cycle: 2.8,
        url: "../pylocalsend-stream.svg",
      },
    };

    const svgHost = document.getElementById("svg-host");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const logEl = document.getElementById("log");
    let currentSvgRoot = null;

    function log(msg) {
      logEl.textContent = msg;
      console.log(msg);
    }

    function roundEven(value) {
      const rounded = Math.max(2, Math.round(value));
      return rounded % 2 === 0 ? rounded : rounded + 1;
    }

    function getOutputConfig() {
      const baseWidth = +document.getElementById("width").value;
      const baseHeight = +document.getElementById("height").value;
      const scale = +document.getElementById("render-scale").value || 1;

      return {
        baseWidth,
        baseHeight,
        scale,
        outputWidth: roundEven(baseWidth * scale),
        outputHeight: roundEven(baseHeight * scale),
      };
    }

    function syncCanvasSize() {
      const { baseWidth, baseHeight, outputWidth, outputHeight } = getOutputConfig();
      canvas.width = outputWidth;
      canvas.height = outputHeight;
      canvas.style.width = `${baseWidth}px`;
      canvas.style.height = `${baseHeight}px`;
    }

    function injectSvg(svgText) {
      const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
      if (doc.querySelector("parsererror")) {
        throw new Error("SVG 解析失败，请检查文件格式");
      }
      const svg = doc.documentElement;
      svgHost.replaceChildren(svg);
      currentSvgRoot = svg;
      applyCanvasSizeToSvg();
      return svg;
    }

    function applyCanvasSizeToSvg() {
      if (!currentSvgRoot) return;
      currentSvgRoot.setAttribute("width", String(canvas.width));
      currentSvgRoot.setAttribute("height", String(canvas.height));
      if (!currentSvgRoot.getAttribute("viewBox")) {
        currentSvgRoot.setAttribute("viewBox", `0 0 ${canvas.width} ${canvas.height}`);
      }
    }

    async function loadSvgFromUrl(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`加载失败: ${url}`);
      return res.text();
    }

    function svgElements(root) {
      return [root, ...root.querySelectorAll("*")];
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "0";
      return Number.parseFloat(value.toFixed(4)).toString();
    }

    function attrToPropertyName(attrName) {
      return attrName.replace(/-([a-z])/g, (_, ch) => ch.toUpperCase());
    }

    function animatedValueToString(value) {
      if (value == null) return "";
      if (typeof value === "string") return value;
      if (typeof value === "number") return formatNumber(value);
      if (typeof value.valueAsString === "string") return value.valueAsString;
      if (typeof value.value === "number") return formatNumber(value.value);
      if (typeof value.animVal === "string") return value.animVal;
      if (value.animVal != null) return animatedValueToString(value.animVal);
      return "";
    }

    function getAnimationTarget(animationEl) {
      if (animationEl.targetElement) return animationEl.targetElement;

      const href =
        animationEl.getAttribute("href") ||
        animationEl.getAttributeNS("http://www.w3.org/1999/xlink", "href");
      if (href?.startsWith("#")) {
        const escaped = CSS.escape(href.slice(1));
        const target = currentSvgRoot?.querySelector(`#${escaped}`);
        if (target) return target;
      }

      return animationEl.parentElement;
    }

    function matrixToTransform(matrix) {
      return `matrix(${[
        matrix.a,
        matrix.b,
        matrix.c,
        matrix.d,
        matrix.e,
        matrix.f,
      ].map(formatNumber).join(" ")})`;
    }

    function bakeCurrentTransform(sourceEl, bakedEl) {
      if (!sourceEl || !bakedEl || !sourceEl.getCTM) return;

      const sourceMatrix = sourceEl.getCTM();
      if (!sourceMatrix) return;

      const parentMatrix = sourceEl.parentElement?.getCTM?.();
      let localMatrix = sourceMatrix;
      if (parentMatrix) {
        try {
          localMatrix = parentMatrix.inverse().multiply(sourceMatrix);
        } catch {
          localMatrix = sourceMatrix;
        }
      }

      bakedEl.setAttribute("transform", matrixToTransform(localMatrix));
    }

    function bakeAnimatedAttribute(sourceEl, bakedEl, attrName) {
      if (!sourceEl || !bakedEl || !attrName) return;

      const propertyName = attrToPropertyName(attrName);
      const animatedProp = sourceEl[propertyName];
      let value = animatedValueToString(animatedProp);

      if (!value) {
        value = getComputedStyle(sourceEl).getPropertyValue(attrName).trim();
      }
      if (!value) {
        value = sourceEl.getAttribute(attrName) || "";
      }
      if (!value) return;

      bakedEl.setAttribute(attrName, value);
    }

    function bakeSvgFrame(svgEl, timeSec, { stripFilters = false } = {}) {
      svgEl.pauseAnimations();
      svgEl.setCurrentTime(timeSec);

      const sourceElements = svgElements(svgEl);
      const baked = svgEl.cloneNode(true);
      const bakedElements = svgElements(baked);

      svgEl.querySelectorAll("animate, animateMotion, animateTransform, set").forEach((animationEl) => {
        const sourceTarget = getAnimationTarget(animationEl);
        const targetIndex = sourceElements.indexOf(sourceTarget);
        const bakedTarget = bakedElements[targetIndex];

        if (animationEl.localName === "animateMotion" || animationEl.localName === "animateTransform") {
          bakeCurrentTransform(sourceTarget, bakedTarget);
        }

        bakeAnimatedAttribute(
          sourceTarget,
          bakedTarget,
          animationEl.getAttribute("attributeName"),
        );
      });

      baked.querySelectorAll("animate, animateMotion, animateTransform, set").forEach((node) => {
        node.remove();
      });

      if (stripFilters) {
        baked.querySelectorAll("[filter]").forEach((node) => node.removeAttribute("filter"));
        baked.querySelectorAll("filter").forEach((node) => node.remove());
      }

      baked.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      baked.setAttribute("width", String(canvas.width));
      baked.setAttribute("height", String(canvas.height));
      return new XMLSerializer()
        .serializeToString(baked)
        .replace(/<\?xml[^?]*\?>\s*/i, "");
    }

    function loadSvgImage(svgEl, timeSec, options) {
      const xml = bakeSvgFrame(svgEl, timeSec, options);
      const url = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(xml)}`;
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("SVG 解码失败"));
        img.src = url;
      });
    }

    async function drawSvgAtTime(timeSec) {
      if (!currentSvgRoot) throw new Error("请先加载 SVG");
      applyCanvasSizeToSvg();

      let img;
      try {
        img = await loadSvgImage(currentSvgRoot, timeSec, { stripFilters: false });
      } catch {
        img = await loadSvgImage(currentSvgRoot, timeSec, { stripFilters: true });
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    async function recordMp4() {
      syncCanvasSize();
      if (!currentSvgRoot) throw new Error("请先选择或加载 SVG");

      const fps = +document.getElementById("fps").value;
      const duration = +document.getElementById("duration").value;
      const cycle = +document.getElementById("cycle").value;
      const { baseWidth, scale } = getOutputConfig();
      const totalFrames = Math.round(duration * fps);
      const outName = document.getElementById("out-name").value.trim() || "animation.mp4";

      const { Muxer, ArrayBufferTarget } = await import(
        "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm"
      );

      const muxer = new Muxer({
        target: new ArrayBufferTarget(),
        video: {
          codec: "avc",
          width: canvas.width,
          height: canvas.height,
        },
        fastStart: "in-memory",
      });

      const codecCandidates = ["avc1.640028", "avc1.4D4028", "avc1.42E01E"];
      let chosenCodec = null;
      for (const codec of codecCandidates) {
        const support = await VideoEncoder.isConfigSupported({
          codec,
          width: canvas.width,
          height: canvas.height,
          bitrate: 4_000_000,
          framerate: fps,
        });
        if (support.supported) {
          chosenCodec = codec;
          break;
        }
      }
      if (!chosenCodec) {
        log("浏览器不支持 H.264 编码，改用 MediaRecorder 输出 WebM…");
        return recordWebm(outName.replace(/\.mp4$/i, ".webm"), fps, duration, cycle, totalFrames);
      }

      const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { throw e; },
      });

      encoder.configure({
        codec: chosenCodec,
        width: canvas.width,
        height: canvas.height,
        bitrate: 4_000_000,
        framerate: fps,
      });

      document.getElementById("record-btn").disabled = true;

      for (let i = 0; i < totalFrames; i++) {
        const t = i / fps;
        const animTime = cycle > 0 ? t % cycle : t;
        await drawSvgAtTime(animTime);

        const frame = new VideoFrame(canvas, {
          timestamp: Math.round((i * 1_000_000) / fps),
          duration: Math.round(1_000_000 / fps),
        });
        encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
        frame.close();

        if (i % fps === 0 || i === totalFrames - 1) {
          log(`编码中… ${i + 1}/${totalFrames} 帧 (${Math.round(((i + 1) / totalFrames) * 100)}%)`);
        }
      }

      await encoder.flush();
      encoder.close();
      muxer.finalize();

      const mp4Name = outName.endsWith(".mp4") ? outName : outName + ".mp4";
      const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
      downloadBlob(blob, mp4Name);
      log(
        `完成！已下载 ${mp4Name}（${canvas.width}x${canvas.height}, ${scale}x, ${totalFrames} 帧，${duration}s @ ${fps}fps）\n\n` +
        `转 GIF：python doc/tools/mp4-to-gif.py ${mp4Name} -o ${mp4Name.replace(/\.mp4$/i, ".gif")} --fps 15 --width ${baseWidth}`
      );
      document.getElementById("record-btn").disabled = false;
    }

    async function recordWebm(outName, fps, duration, cycle, totalFrames) {
      syncCanvasSize();
      const stream = canvas.captureStream(0);
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";
      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data.size) chunks.push(e.data);
      };

      const done = new Promise((resolve) => {
        recorder.onstop = () => resolve(new Blob(chunks, { type: mime }));
      });

      recorder.start();
      for (let i = 0; i < totalFrames; i++) {
        const t = i / fps;
        const animTime = cycle > 0 ? t % cycle : t;
        await drawSvgAtTime(animTime);
        const track = stream.getVideoTracks()[0];
        if (track.requestFrame) track.requestFrame();
        await sleep(1000 / fps);
        if (i % fps === 0) log(`录制 WebM… ${i + 1}/${totalFrames} 帧`);
      }
      recorder.stop();
      const blob = await done;
      downloadBlob(blob, outName);
      log(`WebM 已下载。请用 ffmpeg 转 MP4：ffmpeg -i ${outName} -c copy out.mp4`);
      document.getElementById("record-btn").disabled = false;
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function loadPreset(key) {
      const preset = PRESETS[key];
      if (!preset) return;
      syncCanvasSize();
      log(`加载 ${preset.name}…`);
      const text = await loadSvgFromUrl(preset.url);
      injectSvg(text);
      document.getElementById("duration").value = preset.duration;
      document.getElementById("cycle").value = preset.cycle;
      document.getElementById("out-name").value = preset.file;
      await drawSvgAtTime(0);
      log(`已加载 ${preset.name}，时长 ${preset.duration}s，循环 ${preset.cycle}s`);
    }

    document.querySelectorAll("[data-preset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        loadPreset(btn.dataset.preset).catch((e) => log("错误: " + e.message));
      });
    });

    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      syncCanvasSize();
      const text = await file.text();
      injectSvg(text);
      document.getElementById("out-name").value = file.name.replace(/\.svg$/i, ".mp4");
      await drawSvgAtTime(0);
      log(`已加载 ${file.name}`);
    });

    document.getElementById("preview-btn").addEventListener("click", async () => {
      try {
        syncCanvasSize();
        applyCanvasSizeToSvg();
        await drawSvgAtTime(0);
        log("已刷新预览（t=0）");
      } catch (e) {
        log("错误: " + e.message);
      }
    });

    document.getElementById("record-btn").addEventListener("click", () => {
      recordMp4().catch((e) => {
        log("错误: " + e.message);
        document.getElementById("record-btn").disabled = false;
      });
    });

    ["width", "height", "render-scale"].forEach((id) => {
      document.getElementById(id).addEventListener("change", syncCanvasSize);
    });

    loadPreset("traditional").catch(() => {
      log("预设需通过本地 HTTP 服务打开（见下方说明），或直接选择本地 SVG 文件。");
    });
  </script>
</body>
</html>
