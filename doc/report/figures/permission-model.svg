<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img">
  <title>权限与状态控制模型</title>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#ded8ce;stroke-width:1.2}.muted{fill:#f4f1eb;stroke:#ded8ce;stroke-width:1}
      .title{font:300 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#222;letter-spacing:.08em}
      .h{font:500 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#222}.t{font:300 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#555}
      .m{font:300 12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#888}.tag{font:500 13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2f8f83}
      .line{stroke:#bdb7ae;stroke-width:1.4;fill:none}.red{stroke:#b33a2e;stroke-width:2;fill:none}.green{stroke:#2f8f83;stroke-width:2;fill:none}
    </style>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2f8f83" stroke-width="1.7"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#b33a2e" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text x="560" y="48" text-anchor="middle" class="title">权限与状态控制模型</text>
  <text x="560" y="76" text-anchor="middle" class="m">统一 PIN、接收端 Token、开放路径 Grants 共同决定一次请求能否执行</text>

  <rect x="74" y="126" width="240" height="120" rx="8" class="card"/>
  <text x="194" y="158" text-anchor="middle" class="h">身份入口</text>
  <text x="194" y="190" text-anchor="middle" class="t">CLI：X-PIN</text>
  <text x="194" y="216" text-anchor="middle" class="t">WebUI：/r/&lt;token&gt;</text>

  <rect x="440" y="116" width="240" height="140" rx="8" class="card"/>
  <text x="560" y="148" text-anchor="middle" class="h">SenderService 鉴权</text>
  <text x="560" y="182" text-anchor="middle" class="t">Token 映射 receiver</text>
  <text x="560" y="208" text-anchor="middle" class="t">禁用状态拒绝下载/上传</text>
  <text x="560" y="232" text-anchor="middle" class="m">禁用时还会设置取消事件</text>

  <rect x="806" y="126" width="240" height="120" rx="8" class="card"/>
  <text x="926" y="158" text-anchor="middle" class="h">请求结果</text>
  <text x="926" y="190" text-anchor="middle" class="t">允许：返回列表/流</text>
  <text x="926" y="216" text-anchor="middle" class="t">拒绝：403 / 404</text>

  <path d="M316 186 H438" class="green" marker-end="url(#arrow-green)"/>
  <path d="M682 186 H804" class="green" marker-end="url(#arrow-green)"/>

  <rect x="170" y="326" width="220" height="118" rx="8" class="muted"/>
  <text x="280" y="358" text-anchor="middle" class="tag">download_grants</text>
  <text x="280" y="390" text-anchor="middle" class="t">空字符串表示整项开放</text>
  <text x="280" y="416" text-anchor="middle" class="t">子路径表示局部开放</text>

  <rect x="450" y="326" width="220" height="118" rx="8" class="muted"/>
  <text x="560" y="358" text-anchor="middle" class="tag">upload_allowed</text>
  <text x="560" y="390" text-anchor="middle" class="t">默认禁止浏览器上传</text>
  <text x="560" y="416" text-anchor="middle" class="t">允许后才显示上传页</text>

  <rect x="730" y="326" width="220" height="118" rx="8" class="muted"/>
  <text x="840" y="358" text-anchor="middle" class="tag">catalog version</text>
  <text x="840" y="390" text-anchor="middle" class="t">files + grants 哈希</text>
  <text x="840" y="416" text-anchor="middle" class="t">接收端轮询自动刷新</text>

  <path d="M280 326 C314 286 405 252 478 226" class="line" marker-end="url(#arrow-green)"/>
  <path d="M560 326 V258" class="line" marker-end="url(#arrow-green)"/>
  <path d="M840 326 C782 286 708 254 636 226" class="line" marker-end="url(#arrow-green)"/>

  <path d="M560 258 C560 294 706 296 746 250" class="red" marker-end="url(#arrow-red)"/>
  <text x="690" y="292" text-anchor="middle" class="m">receiver disabled 或 grant 不匹配时阻断</text>
</svg>
